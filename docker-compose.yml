
name: agora-argus

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - agora-net
      - argus-net

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - sql-data:/var/opt/mssql

    networks:
      - agora-net
      - argus-net

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd
          -S localhost -U sa -P "$$MSSQL_SA_PASSWORD"
          -C -Q "SELECT 1" -b > /dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

networks:
  agora-net:
  argus-net:

volumes:
  rabbitmq-data:
  sql-data:
